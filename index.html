<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessing Card & Jiao Toss Lab</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#fef5e7;
  height:100vh;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{color:#c0392b;}

button{
  padding:0.9em 1.8em;
  font-size:1.1em;
  margin:0.4em;
  cursor:pointer;
}

#resultImage{max-width:200px;margin:10px;}

#success,#fail{font-size:2em;display:none;}
#success{color:#e74c3c;}

#blessing{
  display:none;
  font-size:1.6em;
  margin-top:10px;
  color:#b8860b;
}

#qr{
  display:none;
  margin-top:10px;
}

.controls{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h1>🧧 Blessing Card & Jiao Toss Lab 🧧</h1>

<div class="controls">
🎯 Success Rate:
<select id="rate">
<option value="0.45">Normal</option>
<option value="0.65" selected>Lucky</option>
<option value="0.85">Very Lucky</option>
</select>

<button onclick="activateLucky()">🍀 Lucky Mode</button>
</div>

<div>
<button id="tossBtn" onclick="playRound()">Start Round</button>
<button id="newBtn" onclick="startNew()" style="display:none">
Start New Challenge
</button>
</div>

<div id="resultText">Press Start Round</div>
<img id="resultImage" style="display:none">

<div id="counter">Round: 0 / 3</div>

<div id="success">🎉 SUCCESS 🎉</div>
<div id="fail">🎮 GAME OVER</div>

<div id="blessing"></div>

<img id="qr">

<script>
let round = 0;
let successCount = 0;
const maxRounds = 3;

let luckyBoost = false;

function getOutcome(){

  let rate = parseFloat(document.getElementById("rate").value);

  if(luckyBoost) rate = 0.95;

  const r = Math.random();

  if(r < rate){
    return {label:"Sheng Jiao",emoji:"✅",good:true,
    img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"}
  }
  else if(r < rate + 0.2){
    return {label:"Yin Jiao",emoji:"❌",good:false,
    img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"}
  }
  else{
    return {label:"Xiao Jiao",emoji:"😆",good:false,
    img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  }
}

function playRound(){

  if(round >= maxRounds) return;

  if(navigator.vibrate){navigator.vibrate(100);}

  round++;

  const result = getOutcome();

  if(result.good) successCount++;

  document.getElementById("resultText").innerHTML =
    "Round "+round+": "+result.emoji+" "+result.label;

  document.getElementById("resultImage").src=result.img;
  document.getElementById("resultImage").style.display="block";

  document.getElementById("counter").innerText="Round: "+round+" / 3";

  if(round === maxRounds){

    document.getElementById("tossBtn").style.display="none";
    document.getElementById("newBtn").style.display="inline-block";

    if(successCount === 3){
      showSuccess();
    }else{
      document.getElementById("fail").style.display="block";
    }
  }
}

function showSuccess(){

  document.getElementById("success").style.display="block";

  const blessings = [
    "🌸 Good Fortune",
    "📚 Academic Success",
    "💖 Happiness",
    "💪 Health",
    "🧧 Prosperity"
  ];

  const blessing = blessings[Math.floor(Math.random()*blessings.length)];

  document.getElementById("blessing").innerText =
    "Your Blessing: " + blessing;

  document.getElementById("blessing").style.display="block";

  // 📱 QR Code
  const qr = document.getElementById("qr");
  qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" +
           encodeURIComponent(blessing);
  qr.style.display="block";
}

function activateLucky(){
  luckyBoost = true;
  alert("🍀 Lucky Mode Activated!");
}

function startNew(){
  round = 0;
  successCount = 0;
  luckyBoost = false;

  document.getElementById("resultText").innerHTML="Press Start Round";
  document.getElementById("resultImage").style.display="none";
  document.getElementById("counter").innerText="Round: 0 / 3";
  document.getElementById("success").style.display="none";
  document.getElementById("fail").style.display="none";
  document.getElementById("blessing").style.display="none";
  document.getElementById("qr").style.display="none";

  document.getElementById("tossBtn").style.display="inline-block";
  document.getElementById("newBtn").style.display="none";
}
</script>

</body>
</html>
