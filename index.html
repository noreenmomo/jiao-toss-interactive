<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiao Toss Arcade Deluxe</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#fef5e7;
  padding:2em;
}

h1{color:#c0392b;}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:1em 0.5em;
  cursor:pointer;
}

.result{font-size:1.7em;margin:1em 0;}
.counter{font-weight:bold;margin-top:1em;}

#resultImage{
  display:block;
  margin:20px auto;
  max-width:220px;
}

#success{
  font-size:2.5em;
  color:#e74c3c;
  display:none;
  margin-top:20px;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}

/* 🎲 按鈕震動動畫 */
@keyframes shake {
  0%{transform:translate(0,0)}
  25%{transform:translate(4px,0)}
  50%{transform:translate(-4px,0)}
  75%{transform:translate(4px,0)}
  100%{transform:translate(0,0)}
}

.shake{
  animation: shake 0.4s;
}
</style>
</head>

<body>

<h1>
<img src="https://i.postimg.cc/FRKnp3QL/Jiao-Toss.png"
style="display:block;margin:auto;max-width:300px;">
Blessing Card & Jiao Toss Lab
</h1>

<p>Get 3 Sheng Jiao in a row to win!</p>

<button id="tossBtn" onclick="tossJiao()">Toss</button>
<button onclick="resetGame()">Reset</button>

<div class="result" id="resultText">Start tossing!</div>
<img id="resultImage" style="display:none">
<div class="counter" id="counter">
Total Tosses: 0 | Consecutive Sheng Jiao (連續聖筊): 0
</div>

<div id="success">
🎉 CHALLENGE COMPLETE 🎉<br>
Collect your sticker!
</div>

<audio id="winSound"
src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let total = 0;
let streak = 0;

function tossJiao(){

  // 🎲 按鈕震動動畫
  const btn=document.getElementById("tossBtn");
  btn.classList.add("shake");
  setTimeout(()=>btn.classList.remove("shake"),400);

  // 📱 手機震動
  if(navigator.vibrate){
    navigator.vibrate(100);
  }

  const outcomes=[
    {label:"Sheng Jiao (Good Luck)",emoji:"✅",heard:true,img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"},
    {label:"Yin Jiao (Try Again)",emoji:"❌",heard:false,img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"},
    {label:"Xiao Jiao (Smile)",emoji:"😆",heard:false,img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  ];

  const result=outcomes[Math.floor(Math.random()*outcomes.length)];

  total++;

  if(result.heard){
    streak++;
  }else{
    streak=0;
  }

  document.getElementById("resultText").innerHTML =
    result.emoji+" "+result.label;

  document.getElementById("resultImage").src = result.img;
  document.getElementById("resultImage").style.display="block";

  document.getElementById("counter").innerText =
    "Total Tosses: "+total+
    " | Consecutive Sheng Jiao (連續聖筊): "+streak;

  if(streak>=3){
    document.getElementById("success").style.display="block";

    // 🎆 多段煙火
    startFireworks();
    setTimeout(startFireworks,700);
    setTimeout(startFireworks,1400);

    // 🔊 成功音效
    document.getElementById("winSound").play();
  }
}

function resetGame(){
  total=0;
  streak=0;
  document.getElementById("resultText").innerHTML="Start tossing!";
  document.getElementById("resultImage").style.display="none";
  document.getElementById("counter").innerText=
    "Total Tosses: 0 | Consecutive Sheng Jiao (連續聖筊): 0";
  document.getElementById("success").style.display="none";
}

//// 🎆 FIREWORKS ////

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2,
      radius:2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,2*Math.PI);
    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fill();
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
