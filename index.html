<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiao Toss Challenge</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#fef5e7;
  padding:2em;
}

h1{color:#c0392b;}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:1em 0.5em;
  cursor:pointer;
}

.result{
  font-size:1.7em;
  margin:1em 0;
}

.counter{font-weight:bold;margin-top:1em;}

#success{
  font-size:2.5em;
  color:#e74c3c;
  display:none;
  animation: flash 1s infinite;
}

@keyframes flash{
  0%{opacity:1;}
  50%{opacity:0.3;}
  100%{opacity:1;}
}

img{max-width:220px;margin-top:1em;}
</style>
</head>

<body>

<h1>
<img src="https://i.postimg.cc/FRKnp3QL/Jiao-Toss.png"
style="display:block;margin:auto;max-width:300px;">
Blessing Card & Jiao Toss Lab
</h1>

<p>Get 3 Sheng Jiao in a row to win!</p>

<button onclick="tossJiao()">Toss</button>
<button onclick="resetGame()">Reset</button>

<div class="result" id="resultText">Start tossing!</div>
<img id="resultImage" style="display:none">
<div class="counter" id="counter">Total: 0 | Sheng Jiao Streak: 0</div>

<div id="success">🎉 CHALLENGE COMPLETE 🎉<br>Collect your sticker!</div>

<audio id="sound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<script>
let total = 0;
let streak = 0;

function tossJiao(){

  const sound=document.getElementById("sound");
  sound.currentTime=0;
  sound.play();

  const outcomes=[
    {label:"Sheng Jiao (Good Luck)",emoji:"✅",heard:true,img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"},
    {label:"Yin Jiao (Try Again)",emoji:"❌",heard:false,img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"},
    {label:"Xiao Jiao (Smile)",emoji:"😆",heard:false,img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  ];

  const result=outcomes[Math.floor(Math.random()*outcomes.length)];

  total++;

  if(result.heard){
    streak++;
  }else{
    streak=0;
  }

  document.getElementById("resultText").innerHTML=result.emoji+" "+result.label;
  document.getElementById("resultImage").src=result.img;
  document.getElementById("resultImage").style.display="block";
  document.getElementById("counter").innerText=
    "Total: "+total+" | Sheng Jiao Streak: "+streak;

  if(streak>=3){
    document.getElementById("success").style.display="block";
  }
}

function resetGame(){
  total=0;
  streak=0;
  document.getElementById("resultText").innerHTML="Start tossing!";
  document.getElementById("resultImage").style.display="none";
  document.getElementById("counter").innerText="Total: 0 | Sheng Jiao Streak: 0";
  document.getElementById("success").style.display="none";
}
</script>

</body>
</html>
