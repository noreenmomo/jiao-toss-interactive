  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessing Card & Jiao Toss Lab</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:radial-gradient(circle,#fff6cc,#f4d03f);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* 🧧 金光背景 */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,215,0,0.3), transparent);
  animation: glow 6s infinite linear;
  z-index:-1;
}

@keyframes glow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

h1{color:#c0392b;}

.instructions{
  background:white;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  max-width:520px;
}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:0.5em;
}

#resultImage{
  width:220px;
  margin:10px;
  opacity:0;
  transform:scale(0.5);
}

.reveal{
  animation: revealSpin 0.7s forwards;
}

@keyframes revealSpin{
  from{opacity:0;transform:scale(0.3) rotate(0deg);}
  to{opacity:1;transform:scale(1) rotate(720deg);}
}

#success{font-size:2em;color:#e74c3c;display:none;}
#fail{font-size:2em;color:#555;display:none;}

#fortune{
  font-size:1.6em;
  color:#b8860b;
  display:none;
}

#recordBox{
  background:white;
  padding:10px;
  border-radius:10px;
  text-align:left;
  margin-top:10px;
  max-width:420px;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body onclick="enterFullscreen()">

<h1>Blessing Card & Jiao Toss Lab</h1>

<div class="instructions">
<b>🎯 GOAL:</b> Get 3 Sheng Jiao to win<br>
<b>🧧 WHAT IS SHENG JIAO:</b> One flat side + one round side<br>
<b>📋 STEPS:</b><br>
1. Toss the jiao blocks<br>
2. Observe the result<br>
3. Record each round on your worksheet
</div>

<button id="actionBtn" onclick="playRound()">TOSS</button>

<div id="resultText">Press TOSS</div>
<img id="resultImage">

<div id="counter">Round: 0 / 3</div>

<div id="recordBox">
<b>Round Results:</b>
<ul id="recordList"></ul>
</div>

<div id="success">🎉 SUCCESS 🎉</div>
<div id="fail">😅 TRY AGAIN</div>

<div id="fortune"></div>

<!-- 🔊 音效 -->

  <!-- 🪵 第一次擲筊聲 -->
<audio id="firstTossSound"
src="https://assets.mixkit.co/active_storage/sfx/2071/2071-preview.mp3"></audio>
  
<!-- 🪵 擲筊聲 -->
<audio id="tossSound"
src="https://assets.mixkit.co/active_storage/sfx/2065/2065-preview.mp3"></audio>

<!-- 🔔 成功 -->
<audio id="successSound"
src="https://assets.mixkit.co/active_storage/sfx/215/215-preview.mp3"></audio>

  <!-- 🥳 慶祝音效 -->
<audio id="celebrateSound"
src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<!-- 😅 失敗可愛音 -->
<audio id="failSound"
src="https://assets.mixkit.co/active_storage/sfx/2098/2098-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round=0;
let successCount=0;
const maxRounds=3;

// 🎯 成功率 80%
function getOutcome(){
  const r=Math.random();
  if(r<0.8){
    return {label:"Sheng Jiao (Good Luck)",emoji:"✅",good:true,
    img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"}
  }
  else if(r<0.9){
    return {label:"Yin Jiao (Try Again)",emoji:"❌",good:false,
    img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"}
  }
  else{
    return {label:"Xiao Jiao (Smile)",emoji:"😆",good:false,
    img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  }
}

function playRound(){

  if(round>=maxRounds) return;

// 🪵 每次執筊都播放同一個聲音
const sound = document.getElementById("firstTossSound");
sound.currentTime = 0; // 防止快速連按卡住
// 🪵 擲筊聲
sound.play();

// 🔓 只在第一次解鎖慶祝音效
if(!soundUnlocked){
  const unlock = document.getElementById("celebrateSound");
  unlock.muted = true;
  unlock.play().then(()=>{
    unlock.pause();
    unlock.currentTime = 0;
    unlock.muted = false;
  }).catch(()=>{});
  soundUnlocked = true;
}

  if(navigator.vibrate) navigator.vibrate(80);

  round++;

  const result=getOutcome();

  if(result.good) successCount++;

  document.getElementById("resultText").innerText =
    "Round "+round+": "+result.emoji+" "+result.label;

  const img=document.getElementById("resultImage");
  img.src=result.img;
  img.classList.remove("reveal");
  void img.offsetWidth;
  img.classList.add("reveal");

  document.getElementById("counter").innerText =
    "Round: "+round+" / 3";

  const li=document.createElement("li");
  li.textContent="Round "+round+" — "+result.label+" "+result.emoji;
  document.getElementById("recordList").appendChild(li);

  if(round===maxRounds){

    const btn=document.getElementById("actionBtn");

    if(successCount===3){
      showSuccess();
      btn.style.display="none";
    }else{
      showFail();
      btn.innerText="TRY AGAIN";
      btn.onclick=resetGame;
    }
  }
}

function showSuccess(){

  document.getElementById("success").style.display="block";

  // 🔔 Gong
document.getElementById("successSound").play();

// 🥳 慶祝音（延遲）
setTimeout(() => {
  const cheer = document.getElementById("celebrateSound");
  cheer.currentTime = 0;
  cheer.play();
}, 400);  

  // 🎆 煙火
  startFireworks();
  setTimeout(startFireworks,700);
  setTimeout(startFireworks,1400);

  const fortunes=[
    "🧧 Prosperity",
    "💖 Happiness",
    "📚 Academic Success",
    "💪 Health",
    "🌸 Good Fortune"
  ];

  const f=fortunes[Math.floor(Math.random()*fortunes.length)];

  document.getElementById("fortune").innerText =
    "Your Blessing: " + f;

  document.getElementById("fortune").style.display="block";
}

function showFail(){
  document.getElementById("fail").style.display="block";
  document.getElementById("failSound").play();
}

// 🔄 Reset
function resetGame(){
  round=0;
  successCount=0;

  document.getElementById("resultText").innerText="Press TOSS";
  document.getElementById("counter").innerText="Round: 0 / 3";
  document.getElementById("recordList").innerHTML="";
  document.getElementById("success").style.display="none";
  document.getElementById("fail").style.display="none";
  document.getElementById("fortune").style.display="none";

  const btn=document.getElementById("actionBtn");
  btn.innerText="TOSS";
  btn.onclick=playRound;
}

// 📱 Fullscreen kiosk
function enterFullscreen(){
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }
}

//// 🎆 FIREWORKS ////

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fillRect(p.x,p.y,3,3);
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
