<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessing Card & Jiao Toss Lab</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#fef5e7;
  padding:2em;
}

h1{color:#c0392b;}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:1em 0.5em;
  cursor:pointer;
}

#resultImage{
  display:block;
  margin:20px auto;
  max-width:220px;
}

#success, #fail{
  font-size:2.2em;
  display:none;
  margin-top:20px;
}

#success{color:#e74c3c;}
#fail{color:#555;}

#leaderboard{
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:10px;
  max-width:350px;
  margin-left:auto;
  margin-right:auto;
  text-align:left;
}

#selfieFrame{
  display:none;
  margin-top:20px;
  border:8px solid gold;
  padding:15px;
  font-size:1.8em;
  background:#fff8dc;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<h1>🧧 Jiao Toss Challenge 🧧</h1>

<p>Get 3 Sheng Jiao in 3 Rounds to win!</p>

<button id="tossBtn" onclick="playRound()">Start Round</button>
<button id="newBtn" onclick="startNew()" style="display:none">
Start New Challenge
</button>

<div id="resultText">Press Start Round</div>
<img id="resultImage" style="display:none">

<div id="counter">Round: 0 / 3</div>

<div id="success">🎉 CHALLENGE COMPLETE 🎉</div>
<div id="fail">🎮 GAME OVER — Try Again!</div>

<div id="selfieFrame">
📸 Take a photo with your success!
</div>

<div id="leaderboard">
🏆 Successful Players: <span id="score">0</span>
</div>

<audio id="templeSound"
src="https://assets.mixkit.co/active_storage/sfx/215/215-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round = 0;
let successCount = 0;
const maxRounds = 3;
let score = 0;

function playRound(){

  if(round >= maxRounds) return;

  // 📱 手機震動
  if(navigator.vibrate){navigator.vibrate(100);}

  round++;

  const outcomes=[
    {label:"Sheng Jiao",emoji:"✅",good:true,img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"},
    {label:"Yin Jiao",emoji:"❌",good:false,img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"},
    {label:"Xiao Jiao",emoji:"😆",good:false,img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  ];

  const result=outcomes[Math.floor(Math.random()*outcomes.length)];

  if(result.good) successCount++;

  document.getElementById("resultText").innerHTML =
    "Round "+round+": "+result.emoji+" "+result.label;

  document.getElementById("resultImage").src=result.img;
  document.getElementById("resultImage").style.display="block";

  document.getElementById("counter").innerText="Round: "+round+" / 3";

  if(round === maxRounds){

    document.getElementById("tossBtn").style.display="none";
    document.getElementById("newBtn").style.display="inline-block";

    if(successCount === 3){

      // 🎉 成功
      document.getElementById("success").style.display="block";
      document.getElementById("selfieFrame").style.display="block";

      // 🎆 煙火
      startFireworks();
      setTimeout(startFireworks,700);
      setTimeout(startFireworks,1400);

      // 🔔 廟宇音效
      document.getElementById("templeSound").play();

      // 🏆 排行榜
      score++;
      document.getElementById("score").innerText = score;

    }else{

      // 🎮 Game Over
      document.getElementById("fail").style.display="block";
    }
  }
}

function startNew(){
  round = 0;
  successCount = 0;

  document.getElementById("resultText").innerHTML="Press Start Round";
  document.getElementById("resultImage").style.display="none";
  document.getElementById("counter").innerText="Round: 0 / 3";
  document.getElementById("success").style.display="none";
  document.getElementById("fail").style.display="none";
  document.getElementById("selfieFrame").style.display="none";

  document.getElementById("tossBtn").style.display="inline-block";
  document.getElementById("newBtn").style.display="none";
}

//// 🎆 FIREWORKS ////

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2,
      radius:2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,2*Math.PI);
    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fill();
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
