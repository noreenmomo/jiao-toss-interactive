<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiao Toss Ultimate Worksheet Mode</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:#fef5e7;
  padding:2em;
}

h1{color:#c0392b;}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:1em 0.5em;
  cursor:pointer;
}

.result{font-size:1.7em;margin:1em 0;}
.counter{font-weight:bold;margin-top:1em;}

#resultImage{
  display:block;
  margin:20px auto;
  max-width:220px;
}

#success{
  font-size:2.3em;
  color:#e74c3c;
  display:none;
  margin-top:20px;
}

/* 📝 記錄區 */
#recordBox{
  margin-top:25px;
  padding:15px;
  background:white;
  border-radius:10px;
  max-width:350px;
  margin-left:auto;
  margin-right:auto;
  text-align:left;
}

/* 🎲 按鈕震動 */
@keyframes shake {
  0%{transform:translate(0,0)}
  25%{transform:translate(4px,0)}
  50%{transform:translate(-4px,0)}
  75%{transform:translate(4px,0)}
  100%{transform:translate(0,0)}
}
.shake{animation:shake 0.4s;}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<h1>
<img src="https://i.postimg.cc/FRKnp3QL/Jiao-Toss.png"
style="display:block;margin:auto;max-width:300px;">
Blessing Card & Jiao Toss Lab
</h1>

<p>Complete 3 Rounds and record your results!</p>

<button id="tossBtn" onclick="playRound()">Start Round</button>
<button onclick="resetGame()">Reset</button>

<div class="result" id="resultText">Press Start Round</div>
<img id="resultImage" style="display:none">

<div class="counter" id="counter">Round: 0 / 3</div>

<div id="recordBox">
<b>Round Results:</b>
<ul id="recordList"></ul>
</div>

<div id="success">
🎉 ALL 3 ROUNDS COMPLETE 🎉<br>
Collect your sticker!
</div>

<audio id="winSound"
src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round = 0;
const maxRounds = 3;

function playRound(){

  if(round >= maxRounds) return;

  // 🎲 按鈕震動
  const btn=document.getElementById("tossBtn");
  btn.classList.add("shake");
  setTimeout(()=>btn.classList.remove("shake"),400);

  // 📱 手機震動
  if(navigator.vibrate){navigator.vibrate(100);}

  round++;

  const outcomes=[
    {label:"Sheng Jiao (Good Luck)",emoji:"✅",img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"},
    {label:"Yin Jiao (Try Again)",emoji:"❌",img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"},
    {label:"Xiao Jiao (Smile)",emoji:"😆",img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  ];

  const result=outcomes[Math.floor(Math.random()*outcomes.length)];

  document.getElementById("resultText").innerHTML =
    "Round "+round+": "+result.emoji+" "+result.label;

  document.getElementById("resultImage").src=result.img;
  document.getElementById("resultImage").style.display="block";

  document.getElementById("counter").innerText="Round: "+round+" / 3";

  // 📝 記錄
  const li=document.createElement("li");
  li.textContent="Round "+round+" — "+result.label+" "+result.emoji;
  document.getElementById("recordList").appendChild(li);

  if(round === maxRounds){
    document.getElementById("success").style.display="block";

    // 🎆 多段煙火
    startFireworks();
    setTimeout(startFireworks,700);
    setTimeout(startFireworks,1400);

    // 🔊 音效
    document.getElementById("winSound").play();

    btn.disabled = true;
  }
}

function resetGame(){
  round = 0;
  document.getElementById("resultText").innerHTML="Press Start Round";
  document.getElementById("resultImage").style.display="none";
  document.getElementById("counter").innerText="Round: 0 / 3";
  document.getElementById("success").style.display="none";
  document.getElementById("tossBtn").disabled = false;
  document.getElementById("recordList").innerHTML="";
}

//// 🎆 FIREWORKS ////

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2,
      radius:2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,2*Math.PI);
    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fill();
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
