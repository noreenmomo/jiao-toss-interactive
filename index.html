<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessing Card & Jiao Toss Lab</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:radial-gradient(circle,#fff6cc,#f4d03f);
  min-height:100vh;
  padding:20px;
}

.instructions{
  background:white;
  padding:12px;
  border-radius:10px;
  margin:10px auto;
  max-width:520px;
}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:0.5em;
}

#resultImage{
  width:220px;
  margin:10px;
  opacity:0;
  transform:scale(0.5);
}

.reveal{
  animation: revealSpin 0.7s forwards;
}

@keyframes revealSpin{
  from{opacity:0;transform:scale(0.3) rotate(0deg);}
  to{opacity:1;transform:scale(1) rotate(720deg);}
}

#success{font-size:2em;color:#e74c3c;display:none;}
#fail{font-size:2em;color:#555;display:none;}

/* 🧧 籤詩卷軸 */
#fortune{
  font-size:1.8em;
  color:#8b0000;
  background:linear-gradient(#fff8dc,#f5deb3);
  border:4px solid #b8860b;
  border-radius:10px;
  padding:20px;
  width:320px;
  margin:20px auto;
  display:none;
  transform:scaleY(0);
  transform-origin:top;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.scrollOpen{
  animation: scrollOpenAnim 0.8s ease forwards;
}

@keyframes scrollOpenAnim{
  from{transform:scaleY(0);}
  to{transform:scaleY(1);}
}

/* 🌸 花瓣 */
.petal{
  position:fixed;
  top:-20px;
  font-size:24px;
  animation: fall linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<h1>Blessing Card & Jiao Toss Lab</h1>

<div class="instructions">
<b>🎯 GOAL:</b> Get 3 Sheng Jiao to win<br>
<b>🧧 WHAT IS SHENG JIAO:</b> One flat + one round<br>
</div>

<button id="actionBtn" onclick="playRound()">TOSS</button>

<div id="resultText">Press TOSS</div>
<img id="resultImage">

<div id="counter">Round: 0 / 3</div>

<div id="success">🎉 SUCCESS 🎉</div>
<div id="fail">😅 TRY AGAIN</div>

<div id="fortune"></div>

<!-- 🔊 音效 -->
<audio id="tossSound" preload="auto"
src="https://assets.mixkit.co/active_storage/sfx/2071/2071-preview.mp3"></audio>

<audio id="celebrateSound" preload="auto"
src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<!-- 🔔 廟鐘聲 -->
<audio id="bellSound" preload="auto"
src="https://assets.mixkit.co/active_storage/sfx/218/218-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round=0;
let successCount=0;
const maxRounds=3;

const tossAudio=document.getElementById("tossSound");
const celebrateAudio=document.getElementById("celebrateSound");

function getOutcome(){
  const r=Math.random();
  if(r<0.8) return {label:"Sheng Jiao",emoji:"✅",good:true,
    img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"}
  if(r<0.9) return {label:"Yin Jiao",emoji:"❌",good:false,
    img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"}
  return {label:"Xiao Jiao",emoji:"😆",good:false,
    img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
}

function playRound(){
  if(round>=maxRounds) return;

  tossAudio.currentTime=0;
  tossAudio.play().catch(()=>{});

  round++;
  const result=getOutcome();
  if(result.good) successCount++;

  document.getElementById("resultText").innerText =
    "Round "+round+": "+result.emoji+" "+result.label;

  const img=document.getElementById("resultImage");
  img.src=result.img;
  img.classList.remove("reveal");
  void img.offsetWidth;
  img.classList.add("reveal");

  document.getElementById("counter").innerText =
    "Round: "+round+" / 3";

  if(round===maxRounds){
    if(successCount===3){
      showSuccess();
      document.getElementById("actionBtn").style.display="none";
    }else{
      document.getElementById("fail").style.display="block";
    }
  }
}

function showSuccess(){
  document.getElementById("success").style.display="block";

  celebrateAudio.play().catch(()=>{});
  document.getElementById("bellSound").play().catch(()=>{});

  startFireworks();
  startPetals();

  const fortunes=["🧧 Prosperity","💖 Happiness","📚 Academic Success","💪 Health","🌸 Good Fortune"];
  const f=fortunes[Math.floor(Math.random()*fortunes.length)];

  const fortuneEl=document.getElementById("fortune");
  fortuneEl.innerText="Your Blessing: "+f;
  fortuneEl.style.display="block";

  fortuneEl.classList.remove("scrollOpen");
  void fortuneEl.offsetWidth;
  fortuneEl.classList.add("scrollOpen");
}

/* 🎆 煙火 */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  particles=[];
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;
    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fillRect(p.x,p.y,3,3);
  });

  particles=particles.filter(p=>p.speed>0.5);
  if(particles.length>0) requestAnimationFrame(animateFireworks);
}

/* 🌸 花瓣 */
function startPetals(){
  for(let i=0;i<25;i++){
    const petal=document.createElement("div");
    petal.className="petal";
    petal.innerText="🌸";
    petal.style.left=Math.random()*100+"vw";
    petal.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(petal);
    setTimeout(()=>petal.remove(),6000);
  }
}
</script>

</body>
</html>
