<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessing Card & Jiao Toss Lab</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:radial-gradient(circle,#fff6cc,#f4d03f);

  height:100vh;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* 🧧 金光背景 */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,215,0,0.3), transparent);
  animation: glow 6s infinite linear;
  z-index:-1;
}

@keyframes glow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

h1{color:#c0392b;}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:0.5em;
  cursor:pointer;
}

#jiao{
  width:220px;
  transition: transform 0.6s;
}

.flip{
  transform: rotateY(720deg);
}

#resultImage{max-width:220px;margin:10px;}

#success{font-size:2em;color:#e74c3c;display:none;}

#recordBox{
  background:white;
  padding:12px;
  border-radius:10px;
  text-align:left;
  margin-top:10px;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body onclick="enterFullscreen()">

<h1>🧧 Blessing Card & Jiao Toss Lab 🧧</h1>

<!-- 🏫 教學說明 -->
<div>
<b>🎯 GOAL:</b> Get 3 Sheng Jiao to win<br>
<b>🧧 WHAT IS SHENG JIAO:</b> One flat side + one round side<br>
<b>📋 STEPS:</b> Toss → Observe → Record results
</div>

<button id="tossBtn" onclick="playRound()">TOSS</button>

<img id="jiao" src="https://i.postimg.cc/FRKnp3QL/Jiao-Toss.png">

<div id="resultText">Press TOSS</div>
<div id="counter">Round: 0 / 3</div>

<!-- 📝 記錄 -->
<div id="recordBox">
<b>Round Results:</b>
<ul id="recordList"></ul>
</div>

<div id="success">🎉 SUCCESS 🎉</div>

<div>🏆 Successful Players: <span id="score">0</span></div>

<audio id="gong"
src="https://assets.mixkit.co/active_storage/sfx/215/215-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round=0;
let successCount=0;
let totalWins=0;
const maxRounds=3;

// 🎯 成功率 80%
function getOutcome(){
  return Math.random()<0.8;
}

function playRound(){

  if(round>=maxRounds) return;

  // 🔔 開場 Gong
  document.getElementById("gong").play();

  // 📳 手機震動
  if(navigator.vibrate) navigator.vibrate(80);

  // 🎲 Toss 按下動畫
  document.getElementById("jiao").classList.add("flip");
  setTimeout(()=>document.getElementById("jiao").classList.remove("flip"),600);

  round++;

  const good = getOutcome();

  let label = good ? "Sheng Jiao ✅" : "Not Sheng Jiao ❌";

  if(good) successCount++;

  document.getElementById("resultText").innerText =
    "Round "+round+": "+label;

  document.getElementById("counter").innerText =
    "Round: "+round+" / 3";

  // 📝 記錄
  const li=document.createElement("li");
  li.textContent="Round "+round+" — "+label;
  document.getElementById("recordList").appendChild(li);

  if(round===maxRounds){

    if(successCount===3){
      showSuccess();
    }

    round=maxRounds;
  }
}

function showSuccess(){
  document.getElementById("success").style.display="block";

  totalWins++;
  document.getElementById("score").innerText=totalWins;

  startFireworks();
}

// 📱 Fullscreen kiosk
function enterFullscreen(){
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }
}

//// 🎆 FIREWORKS ////

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fillRect(p.x,p.y,3,3);
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
