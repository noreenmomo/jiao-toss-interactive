<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessing Card & Jiao Toss Lab</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:radial-gradient(circle,#fff6cc,#f4d03f);
  min-height:100vh;
  overflow:auto;
  padding:20px;
}

.instructions{
  background:white;
  padding:12px;
  border-radius:10px;
  margin:10px auto;
  max-width:520px;
}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:0.5em;
}

#resultImage{
  width:220px;
  margin:10px;
  opacity:0;
  transform:scale(0.5);
}

.reveal{
  animation: revealSpin 0.7s forwards;
}

@keyframes revealSpin{
  from{opacity:0;transform:scale(0.3) rotate(0deg);}
  to{opacity:1;transform:scale(1) rotate(720deg);}
}

#success{font-size:2em;color:#e74c3c;display:none;}
#fail{font-size:2em;color:#555;display:none;}

#fortune{
  font-size:1.6em;
  color:#b8860b;
  display:none;
}

#recordBox{
  background:white;
  padding:10px;
  border-radius:10px;
  text-align:left;
  margin:10px auto;
  max-width:420px;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<h1>Blessing Card & Jiao Toss Lab</h1>

<div class="instructions">
<b>🎯 GOAL:</b> Get 3 Sheng Jiao to win<br>
<b>🧧 WHAT IS SHENG JIAO:</b> One flat side + one round side<br>
<b>📋 STEPS:</b><br>
1. Toss the jiao blocks<br>
2. Observe the result<br>
3. Record each round on your worksheet
</div>

<button id="actionBtn" onclick="playRound()">TOSS</button>

<div id="resultText">Press TOSS</div>
<img id="resultImage">

<div id="counter">Round: 0 / 3</div>

<div id="recordBox">
<b>Round Results:</b>
<ul id="recordList"></ul>
</div>

<div id="success">🎉 SUCCESS 🎉</div>
<div id="fail">😅 TRY AGAIN</div>

<div id="fortune"></div>

<!-- 🎲 Toss 音效 -->
<audio id="tossSound" preload="auto"
src="https://assets.mixkit.co/active_storage/sfx/2071/2071-preview.mp3"></audio>

<!-- 🥳 慶祝音效 -->
<audio id="celebrateSound" preload="auto"
src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round=0;
let successCount=0;
const maxRounds=3;

let soundUnlocked=false;

const tossAudio=document.getElementById("tossSound");
const celebrateAudio=document.getElementById("celebrateSound");

// 🔓 解鎖音效（手機必要）
function unlockSound(){
  if(!soundUnlocked){
    [tossAudio, celebrateAudio].forEach(a=>{
      a.muted=true;
      a.play().then(()=>{
        a.pause();
        a.currentTime=0;
        a.muted=false;
      }).catch(()=>{});
    });
    soundUnlocked=true;
  }
}

function getOutcome(){
  const r=Math.random();
  if(r<0.8){
    return {label:"Sheng Jiao (Good Luck)",emoji:"✅",good:true,
    img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"}
  }
  else if(r<0.9){
    return {label:"Yin Jiao (Try Again)",emoji:"❌",good:false,
    img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"}
  }
  else{
    return {label:"Xiao Jiao (Smile)",emoji:"😆",good:false,
    img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  }
}

function playRound(){

  unlockSound();

  if(round>=maxRounds) return;

  // 🎲 每回合執爻聲
  tossAudio.currentTime=0;
  tossAudio.play().catch(()=>{});

  round++;
  const result=getOutcome();

  if(result.good) successCount++;

  document.getElementById("resultText").innerText =
    "Round "+round+": "+result.emoji+" "+result.label;

  const img=document.getElementById("resultImage");
  img.src=result.img;
  img.classList.remove("reveal");
  void img.offsetWidth;
  img.classList.add("reveal");

  document.getElementById("counter").innerText =
    "Round: "+round+" / 3";

  const li=document.createElement("li");
  li.textContent="Round "+round+" — "+result.label+" "+result.emoji;
  document.getElementById("recordList").appendChild(li);

  if(round===maxRounds){
    const btn=document.getElementById("actionBtn");

    if(successCount===3){
      showSuccess();
      btn.style.display="none"; // ⭐ 成功 → 沒有 TRY AGAIN 按鈕
    }else{
      showFail();
      btn.innerText="TRY AGAIN";
      btn.onclick=resetGame;
    }
  }
}

function showSuccess(){

  document.getElementById("success").style.display="block";

  celebrateAudio.currentTime = 0;
  celebrateAudio.volume = 0.9;
  celebrateAudio.loop = false;
  celebrateAudio.play().catch(()=>{});

  startFireworks();

  const fortunes=["🧧 Prosperity","💖 Happiness","📚 Academic Success","💪 Health","🌸 Good Fortune"];
  const f=fortunes[Math.floor(Math.random()*fortunes.length)];

  const fortuneEl=document.getElementById("fortune");
  fortuneEl.innerText="Your Blessing: "+f;
  fortuneEl.style.display="block";
  fortuneEl.scrollIntoView({behavior:"smooth"});
}

function showFail(){
  document.getElementById("fail").style.display="block";
}

function resetGame(){
  round=0;
  successCount=0;

  document.getElementById("resultText").innerText="Press TOSS";
  document.getElementById("counter").innerText="Round: 0 / 3";
  document.getElementById("recordList").innerHTML="";
  document.getElementById("success").style.display="none";
  document.getElementById("fail").style.display="none";
  document.getElementById("fortune").style.display="none";

  const btn=document.getElementById("actionBtn");
  btn.style.display="inline-block";
  btn.innerText="TOSS";
  btn.onclick=playRound;
}

// 🎆 FIREWORKS
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fillRect(p.x,p.y,3,3);
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
