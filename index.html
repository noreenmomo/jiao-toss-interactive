<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiao Toss Fortune Draw</title>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  background:radial-gradient(circle,#fff6cc,#f4d03f);

  height:100vh;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* 🧧 金光背景 */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,215,0,0.3), transparent);
  animation: glow 6s infinite linear;
  z-index:-1;
}

@keyframes glow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

button{
  padding:1em 2em;
  font-size:1.2em;
  margin:0.5em;
}

#resultImage{
  width:220px;
  margin:10px;
  opacity:0;
  transform:scale(0.5) rotate(0deg);
}

/* 🌀 結果旋轉出現 */
.reveal{
  animation: revealSpin 0.7s forwards;
}

@keyframes revealSpin{
  from{
    opacity:0;
    transform:scale(0.3) rotate(0deg);
  }
  to{
    opacity:1;
    transform:scale(1) rotate(720deg);
  }
}

#success{font-size:2em;color:#e74c3c;display:none;}
#fail{font-size:2em;color:#555;display:none;}

#fortune{
  font-size:1.8em;
  color:#b8860b;
  display:none;
  margin-top:10px;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body onclick="enterFullscreen()">

<h1>🧧 Jiao Toss Cultural Lab 🧧</h1>

<button onclick="playRound()">TOSS</button>

<div id="resultText">Press TOSS</div>
<img id="resultImage">

<div id="counter">Round: 0 / 3</div>

<div id="success">🎉 SUCCESS 🎉</div>
<div id="fail">🎮 TRY AGAIN</div>

<div id="fortune"></div>

<!-- 🔊 音效 -->
<audio id="tossSound"
src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

<audio id="gong"
src="https://assets.mixkit.co/active_storage/sfx/215/215-preview.mp3"></audio>

<audio id="failSound"
src="https://assets.mixkit.co/active_storage/sfx/2958/2958-preview.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
let round=0;
let successCount=0;
const maxRounds=3;

// 🎯 成功率 80%
function getOutcome(){

  const r=Math.random();

  if(r<0.8){
    return {label:"Sheng Jiao (Good Luck)",emoji:"✅",good:true,
    img:"https://i.postimg.cc/Pf7rmMk8/Sheng-Jiao-Good-Luck.png"}
  }
  else if(r<0.9){
    return {label:"Yin Jiao (Try Again)",emoji:"❌",good:false,
    img:"https://i.postimg.cc/kMRDYHsH/Yin-Jiao-Try-Again.png"}
  }
  else{
    return {label:"Xiao Jiao (Smile)",emoji:"😆",good:false,
    img:"https://i.postimg.cc/FHVYgJpv/Xiao-Jiao-Smile.png"}
  }
}

function playRound(){

  if(round>=maxRounds) return;

  // 🔊 Toss 音
  document.getElementById("tossSound").play();

  if(navigator.vibrate) navigator.vibrate(80);

  round++;

  const result=getOutcome();

  if(result.good) successCount++;

  document.getElementById("resultText").innerText =
    "Round "+round+": "+result.emoji+" "+result.label;

  const img=document.getElementById("resultImage");
  img.src=result.img;

  // 🌀 觸發旋轉出現
  img.classList.remove("reveal");
  void img.offsetWidth;
  img.classList.add("reveal");

  document.getElementById("counter").innerText="Round: "+round+" / 3";

  if(round===maxRounds){

    if(successCount===3){
      showSuccess();
    }else{
      showFail();
    }

    round=maxRounds;
  }
}

function showSuccess(){
  document.getElementById("success").style.display="block";
  document.getElementById("gong").play();
  startFireworks();

  const fortunes=[
    "🧧 Prosperity",
    "💖 Happiness",
    "📚 Academic Success",
    "💪 Health",
    "🌸 Good Fortune"
  ];

  const f=fortunes[Math.floor(Math.random()*fortunes.length)];

  document.getElementById("fortune").innerText =
    "Your Blessing: " + f;

  document.getElementById("fortune").style.display="block";
}

function showFail(){
  document.getElementById("fail").style.display="block";
  document.getElementById("failSound").play();
}

// 📱 Fullscreen kiosk
function enterFullscreen(){
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }
}

//// 🎆 FIREWORKS ////

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*6+2
    });
  }
  animateFireworks();
}

function animateFireworks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;

    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fillRect(p.x,p.y,3,3);
  });

  particles=particles.filter(p=>p.speed>0.5);

  if(particles.length>0){
    requestAnimationFrame(animateFireworks);
  }
}
</script>

</body>
</html>
